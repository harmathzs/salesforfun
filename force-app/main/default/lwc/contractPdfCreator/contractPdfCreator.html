<!-- Contract PDF Creator -->
<template>
  <lightning-card title="Create Contract PDF">
    <section if:true={contract} class="slds-p-around_medium">
      <p>Contract: {contract.ContractNumber} — Account: {contract.Account.Name}</p>
    </section>

    <section if:true={contract} class="slds-p-around_medium" style="height:480px">
      <!-- Preview iframe -->
      <iframe src={vfUrl} style="width:100%;height:100%;border:1px solid #ddd" title="Contract PDF preview"></iframe>
    </section>

    <section if:true={contract} class="slds-p-around_medium">
      <lightning-button variant="brand-outline" icon-name="action:download" icon-position="left" label="Download or Open PDF in new tab" onclick={handleDownload} class="slds-m-right_small"></lightning-button>
      <lightning-button variant="brand" icon-name="utility:save" icon-position="left" label="Save to Contract" onclick={handleSave} class="slds-m-right_small"></lightning-button>
      <lightning-button variant="brand-outline" icon-name="action:email" icon-position="left" label="Email PDF" onclick={openEmailModal} class="slds-m-right_small"></lightning-button>
      <lightning-button variant="destructive-text" icon-name="standard:first_non_empty" icon-position="left" label="Close" onclick={handleCancel}></lightning-button>
    </section>

    <!-- Email modal -->
    <template if:true={showEmailModal}>
      <section class="slds-modal slds-fade-in-open" role="dialog">
        <div class="slds-modal__container">
          <header class="slds-modal__header">
            <h2 class="slds-text-heading_medium">Email Contract PDF</h2>
          </header>
          <div class="slds-modal__content slds-p-around_medium">
            <lightning-input label="To" value={emailTo} onchange={onEmailToChange}></lightning-input>
            <lightning-input label="Subject" value={emailSubject} onchange={onEmailSubjectChange}></lightning-input>
            <lightning-textarea label="Body" value={emailBody} onchange={onEmailBodyChange}></lightning-textarea>
          </div>
          <footer class="slds-modal__footer slds-grid slds-grid_align-end">
            <lightning-button variant="neutral" label="Cancel" onclick={closeEmailModal}></lightning-button>
            <lightning-button variant="brand" label="Send" onclick={handleSendEmail} class="slds-m-left_small"></lightning-button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
  </lightning-card>
</template>
